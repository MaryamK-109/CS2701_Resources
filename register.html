<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link href="styles.css" rel="stylesheet">

        <title>Registration</title>
    </head>

    <body>
        <div class="form-box">
            <form>
                <h1>Register Account</h1>
                <div class="field">
                    <label for="email">Email</label>
                    <input type="text" autofocus required autocomplete="off" placeholder="Enter Email" id="email">
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" required autocomplete="off" placeholder="Enter Password" id="password">
                </div>
                <div class="field">
                    <label for="password-confirm">Confirm Password</label>
                    <input type="password" required autocomplete="off" placeholder="Confirm Password" id="password-confirm">
                </div>
                <button>Register</button>
            </form>
        </div>
    </body>
</html>
